name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            bash -lc '
              set -e

              APP_NAME="${{ github.event.repository.name }}"
              APP_DIR="/var/www/apps/$APP_NAME"

              echo "Deploying $APP_NAME to $APP_DIR"

              mkdir -p /var/www/apps

              if [ ! -d "$APP_DIR/.git" ]; then
                git clone git@github.com:${{ github.repository }}.git "$APP_DIR"
              fi

              cd "$APP_DIR"

              git fetch origin
              git reset --hard origin/main
              git clean -fd

              # Ensure NVM is installed on the remote server (install if missing) and use Node 20
              export NVM_DIR="$HOME/.nvm"
              if [ ! -s "$NVM_DIR/nvm.sh" ]; then
                echo "nvm not found, installing nvm..."
                # install nvm (idempotent) - pinned to a specific nvm release
                curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.5/install.sh | bash
              fi

              # Load nvm and install/use Node 20
              [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
              nvm install 20 || true
              nvm alias default 20 || true
              nvm use 20

              npm ci
              npm run build

              pm2 reload ecosystem.config.cjs || pm2 start ecosystem.config.cjs
            '
